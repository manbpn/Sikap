<style>

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:920px;margin:0 auto}

.brand{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:18px 0 8px}
.brand .mark{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.14em;color:var(--green)}

.login{max-width:400px;margin:0 auto}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;padding:6px 0;margin-bottom:4px}

.att div{background:var(--bg);border-radius:4px;padding:10px 6px;text-align:center}
.att b{display:block;font-family:var(--mono);font-size:22px}.att span{font-size:12.5px;color:var(--muted)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}

.tab[aria-selected="true"]{background:var(--green);border-color:var(--green);color:var(--surface)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.muted{color:var(--muted)}
.rec{border-bottom:1px solid var(--line);padding:9px 0;font-size:14.5px}
.rec:last-child{border:0}

.empty{color:var(--muted);font-size:14.5px;margin:0}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font:inherit;font-size:13.5px;padding:2px 4px}
.search{margin-bottom:12px}
.wrap{max-width:1040px}
.pt.wait{color:var(--gold);background:var(--gold-soft)}
.simnote{background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold);border-radius:6px;padding:10px 14px;font-size:14px}
.phone{width:min(100%,360px);margin:0 auto;border:9px solid var(--ink);border-radius:36px;background:var(--surface);min-height:640px;display:flex;flex-direction:column;overflow:hidden}
.ph-bar{display:flex;justify-content:space-between;padding:10px 20px 4px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.ph-body{flex:1;padding:14px 20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.fp{width:132px;height:132px;border-radius:50%;border:2px dashed var(--green);background:var(--green-soft);display:grid;place-items:center;margin:8px auto;color:var(--green);cursor:pointer;padding:0}
.fp.busy{animation:pulse 1.1s ease-in-out infinite}

.scene{display:block;width:100%;height:auto;border-radius:8px}

.scene .c2{animation-duration:36s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translateX(44px)}}
.scene .bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.scene .arm{transform-box:fill-box;transform-origin:0% 100%;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{50%{transform:rotate(-30deg)}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}}
.idc{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.idc .scene{border-radius:0}
.idc-body{display:flex;gap:12px;align-items:flex-end;padding:0 14px 10px;margin-top:-24px}
.idc-av{width:64px;height:64px;border-radius:50%;border:3px solid var(--surface);background:var(--green);color:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;flex:none}
.idc-name{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2}
.idc-pill{padding:0 14px 14px}
.nav-top{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:50%;border:2px dashed var(--green);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;color:var(--green)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;padding:36px 0 8px}
.hero h1{font-size:clamp(30px,5.4vw,50px);letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--green)}
.hero .lead{color:var(--muted);max-width:46ch;margin:14px 0 0;font-size:17px}
.gates2{display:flex;flex-direction:column;gap:14px}
.gates2 .gate{border-left:4px solid var(--green)}
.gates2 .gate.alt{border-left-color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:30px}
.stats div{background:var(--surface);padding:16px 18px;min-width:0}
.stats b{display:block;font-family:var(--mono);font-size:28px;color:var(--green)}
.stats span{font-size:13px;color:var(--muted)}
.appbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--green);color:var(--surface);border-radius:6px;padding:16px 20px;margin-bottom:20px}
.appbar h1{font-size:20px;color:inherit}
.appbar .who{font-size:14px;color:inherit}
.appbar .btn{background:transparent;border-color:var(--surface);color:var(--surface)}
.greet{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.greet h2{font-size:26px}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:start}
.tabs{flex-direction:column;gap:4px;margin-bottom:0;position:sticky;top:12px}
.tab{text-align:left;width:100%}
@media(max-width:760px){
  .hero{grid-template-columns:1fr;padding-top:24px}
  .stats{grid-template-columns:1fr}
  .layout{grid-template-columns:1fr;gap:14px}
  .tabs{flex-direction:row;position:static}
  .tab{width:auto}
}
</style>

<script>
(function(){
var KEY='sikap:v5';
var KAT={pelanggaran:[["Terlambat masuk sekolah",5],["Pulang sebelum waktunya tanpa izin",10],["Atribut seragam tidak lengkap",5],["Tidak mengerjakan tugas",5],["Tidak mengikuti upacara atau sholat berjamaah",10],["Membolos jam pelajaran",15],["Merokok di lingkungan sekolah",25],["Berkelahi dengan siswa lain",30],["Lainnya (isi poin manual)",0]],
reward:[["Membantu teman atau warga sekolah",5],["Aktif organisasi (OSIS atau ekskul)",10],["Nilai terbaik di kelas",15],["Juara lomba tingkat kota atau provinsi",20],["Juara lomba tingkat nasional",35],["Lainnya (isi poin manual)",0]]};

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(i){try{return new Date(i+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}catch(e){return i}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function seed(){
  var st=[["s1","24001","Ahmad Fauzan Ramadhan","XI IPA 1"],["s2","24002","Siti Nur Aisyah","XI IPA 1"],["s3","24003","Muhammad Rizky Pratama","XI IPA 1"],["s4","24004","Nabila Putri Anggraini","XI IPS 2"],["s5","24005","Fajar Nugroho","XI IPS 2"],["s6","24006","Khairunnisa Salsabila","XI IPS 2"]]
   .map(function(x){return {id:x[0],nis:x[1],nama:x[2],kelas:x[3],pass:x[1]}});
  var staff=[];
  var rec=[
   {id:uid(),sid:"s1",type:"pelanggaran",kat:"Terlambat masuk sekolah",poin:5,cat:"Terlambat 15 menit karena macet.",tgl:"2026-10-05"},
   {id:uid(),sid:"s2",type:"reward",kat:"Juara lomba tingkat kota atau provinsi",poin:20,cat:"Juara 2 lomba pidato bahasa Arab tingkat kota.",tgl:"2026-10-07"},
   {id:uid(),sid:"s5",type:"reward",kat:"Aktif organisasi (OSIS atau ekskul)",poin:10,cat:"Ketua pelaksana peringatan Maulid Nabi.",tgl:"2026-10-09"},
   {id:uid(),sid:"s4",type:"pelanggaran",kat:"Tidak mengerjakan tugas",poin:5,cat:"Tugas Matematika tidak dikumpulkan.",tgl:"2026-10-08"},
   {id:uid(),sid:"s3",type:"pelanggaran",kat:"Membolos jam pelajaran",poin:15,cat:"Tidak masuk jam ke-4 dan ke-5.",tgl:"2026-10-12"}];
  var dates=["2026-10-08","2026-10-09","2026-10-12","2026-10-13","2026-10-14"];
  var pat={s1:"hhhsh",s2:"hhhhh",s3:"hahhi",s4:"hhshh",s5:"hhhhh",s6:"ihhha"};
  var map={h:"hadir",s:"sakit",i:"izin",a:"alpa"},att=[];
  Object.keys(pat).forEach(function(sid){pat[sid].split('').forEach(function(c,k){att.push({id:uid(),sid:sid,tgl:dates[k],st:map[c]})})});
  var late=[{id:uid(),sid:"s1",tgl:today(),waktu:"07:25",menit:25,alasan:"Macet atau gangguan transportasi",status:"menunggu"}];
  var pul=[{id:uid(),sid:"s2",tgl:today(),waktu:"10:30",alasan:"Sakit atau kondisi kesehatan",cat:"Dijemput orang tua.",oleh:"Ibu Rahmawati, S.Pd"}];
  return {students:st,staff:staff,records:rec,att:att,late:late,pulang:pul,cfg:{jam:"07:00"}};
}
var D;
function load(){try{var r=localStorage.getItem(KEY);if(r){D=JSON.parse(r);return}}catch(e){}D=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
load();

var MODE='siswa',HOME=MODE==='siswa'?'ls':MODE==='staf'?'lg':'portal';
document.title=MODE==='staf'?'SIKAP Guru dan Admin':MODE==='siswa'?'SIKAP Siswa':document.title;
D.late=D.late||[];D.pulang=D.pulang||[];D.cfg=D.cfg||{jam:'07:00'};if(D.staff)D.staff=D.staff.filter(function(x){return x.role!=='Guru mapel'});
if(MODE==='staf'&&(!D.staff||!D.staff.length)){D.staff=seed().staff;save()}
var S={view:HOME,user:null,kind:null,tab:'ringkasan',err:'',flash:'',loginAt:null};
var $app=document.getElementById('app');

function pel(id){return D.records.filter(function(r){return r.sid===id&&r.type==='pelanggaran'}).reduce(function(a,r){return a+r.poin},0)}
function pgh(id){return D.records.filter(function(r){return r.sid===id&&r.type==='reward'}).reduce(function(a,r){return a+r.poin},0)}
function rank(s){var l=D.students.filter(function(x){return x.kelas===s.kelas}).map(function(x){return {id:x.id,p:pel(x.id)}}).sort(function(a,b){return a.p-b.p});return l.findIndex(function(x){return x.id===s.id})+1}
function byId(id){return D.students.find(function(s){return s.id===id})}
var DAYS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
function allScope(u){return u.role==='Admin'||u.role==='Guru BK'||u.role==='Waka Siswa'||u.role==='Kepala madrasah'}
function scoped(u){return D.students.filter(function(s){return allScope(u)||(u.kelas||[]).indexOf(s.kelas)>-1})}
function visible(sid){var s=byId(sid);return !!s&&scoped(S.user).indexOf(s)>-1}
function kelasList(){var m={};D.students.forEach(function(s){m[s.kelas]=1});return Object.keys(m).sort()}
function isPiket(u){return (u.piket||[]).indexOf(new Date().getDay())>-1}
function can(u,a){var r=u.role;
  if(a==='absen'||a==='pulang')return r==='Admin'||(r==='Guru piket'&&isPiket(u));
  if(a==='setuju')return r==='Admin'||(r==='Guru piket'&&isPiket(u));
  if(a==='reward')return r==='Admin'||r==='Waka Siswa';
  if(a==='jadwal')return r==='Admin'||r==='Waka Siswa';
  if(a==='siswa'||a==='reset'||a==='akun')return r==='Admin';
  if(a==='catat')return r!=='Kepala madrasah';
  return true}
function limit(type){return type==='pelanggaran'&&S.user.role!=='Admin'&&S.user.role!=='Guru BK'&&S.user.role!=='Waka Siswa'}
function katList(type){return KAT[type].map(function(k,i){return [k,i]}).filter(function(x){return !limit(type)||(x[0][1]>0&&x[0][1]<=10)})}
function dutyNote(u){var n=allScope(u)?' &middot; Semua kelas':' &middot; Lingkup: '+esc((u.kelas||[]).join(', ')||'belum ada kelas');return n+(u.role==='Guru piket'?' &middot; '+(isPiket(u)?'Bertugas piket hari ini':'Tidak piket hari ini'):'')}
function lockedAbsen(){var on=D.staff.filter(function(s){return s.role==='Guru piket'&&isPiket(s)}).map(function(s){return esc(s.nama)});
  return '<div class="card"><div class="h"><h3>Absensi harian</h3></div><p class="empty">Kehadiran harian hanya diisi oleh guru piket yang bertugas hari ini, atau oleh admin.</p><p style="margin:12px 0 0"><b>Piket hari ini:</b> '+(on.length?on.join(', '):'belum ada jadwal')+'</p></div>'}
function lockedCatat(){return '<div class="card"><div class="h"><h3>Input catatan</h3></div><p class="empty">Peranmu hanya bisa melihat data. Pencatatan dilakukan guru, Guru BK, Waka Siswa, atau admin.</p></div>'}
var ALASAN=['Macet atau gangguan transportasi','Hujan deras atau banjir','Kendaraan mogok atau rusak','Sakit atau kondisi kesehatan','Mengantar atau membantu keluarga','Urusan keluarga mendadak','Bangun kesiangan','Alasan lain (ditanyakan guru piket)'];
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hm(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function toMin(t){var p=String(t).split(':');return (+p[0])*60+(+p[1]||0)}
function fmtMenit(m){return m<60?m+' menit':Math.floor(m/60)+' jam'+(m%60?' '+(m%60)+' menit':'')}
function stat(s){return s==='disetujui'?['Alasan diterima','good']:s==='ditolak'?['Alasan ditolak','bad']:['Menunggu persetujuan','wait']}
function stu(x,girl){
  var skin='#E3B08B',ink='#2D3B34',pants='#5B6470',shirt='#F5F5F0',hij='#E6E9E4',g='<g transform="translate('+x+',196) scale(.8)"><g class="bob">';
  g+=girl?'<path d="M-10 -26L10 -26L13 0L-13 0Z" fill="'+pants+'" stroke="'+ink+'" stroke-width="1"/>':'<rect x="-7" y="-26" width="5" height="26" fill="'+pants+'"/><rect x="2" y="-26" width="5" height="26" fill="'+pants+'"/>';

function perKelasT(sc){var m={};sc.forEach(function(x){var k=m[x.kelas]=m[x.kelas]||{n:0,p:0,g:0,t:0,c:0};k.n++;k.p+=pel(x.id);k.g+=pgh(x.id);k.t+=D.late.filter(function(l){return l.sid===x.id}).length;k.c+=D.pulang.filter(function(l){return l.sid===x.id}).length});
  return tbl(['Kelas','Siswa','Pelanggaran','Penghargaan','Terlambat','Pulang cepat'],Object.keys(m).sort().map(function(k){var v=m[k];return '<tr><td>'+esc(k)+'</td><td>'+v.n+'</td><td><span class="pt bad">'+v.p+'</span></td><td><span class="pt good">'+v.g+'</span></td><td>'+v.t+'</td><td>'+v.c+'</td></tr>'}),'Belum ada siswa.')}
function eventsT(ids){var e=[];D.late.forEach(function(x){if(ids[x.sid])e.push({t:x.tgl,w:x.waktu,sid:x.sid,j:'Terlambat '+fmtMenit(x.menit),k:stat(x.status)[0]})});D.pulang.forEach(function(x){if(ids[x.sid])e.push({t:x.tgl,w:x.waktu,sid:x.sid,j:'Pulang cepat',k:x.alasan})});e.sort(function(a,b){return (b.t+b.w).localeCompare(a.t+a.w)});
  return tbl(['Tanggal','Siswa','Jenis','Keterangan'],e.slice(0,8).map(function(x){var s2=byId(x.sid);return '<tr><td style="white-space:nowrap">'+fmt(x.t)+' '+esc(x.w)+'</td><td>'+esc(s2?s2.nama:'-')+'</td><td>'+esc(x.j)+'</td><td class="muted">'+esc(x.k)+'</td></tr>'}),'Belum ada catatan.')}
function perhatianT(sc){var l=sc.map(function(x){return {s:x,p:pel(x.id)}}).filter(function(x){return x.p>=10}).sort(function(a,b){return b.p-a.p}).slice(0,8);
  return tbl(['Nama','Kelas','Pelanggaran','Status'],l.map(function(r){return '<tr><td>'+esc(r.s.nama)+'</td><td class="muted">'+esc(r.s.kelas)+'</td><td><span class="pt bad">'+r.p+'</span></td><td class="muted">'+(r.p>=30?'Perlu pembinaan':'Perlu perhatian')+'</td></tr>'}),'Tidak ada siswa yang perlu perhatian.')}
function rankT(sc){var rows=sc.map(function(x){return {s:x,p:pel(x.id),g:pgh(x.id)}}).sort(function(a,b){return a.p-b.p});
  return tbl(['#','Nama','Kelas','Pelanggaran','Penghargaan'],rows.map(function(r,i){return '<tr><td style="font-family:var(--mono)">'+(i+1)+'</td><td>'+esc(r.s.nama)+'</td><td class="muted">'+esc(r.s.kelas)+'</td><td><span class="pt bad">'+r.p+'</span></td><td><span class="pt good">'+r.g+'</span></td></tr>'}),'Belum ada siswa dalam lingkupmu. Admin dapat mengatur lingkup kelas di tab Hak akses.')}
function tRingkasan(){
  var u=S.user,r=u.role,sc=scoped(u),tg=today(),ids={};sc.forEach(function(x){ids[x.id]=1});
  var tp=0;sc.forEach(function(x){tp+=pel(x.id)});var lt=D.late.filter(function(x){return x.tgl===tg&&ids[x.sid]}).length,pc=D.pulang.filter(function(x){return x.tgl===tg&&ids[x.sid]}).length;
  var pend=D.late.filter(function(x){return x.status==='menunggu'&&ids[x.sid]}).length;
  var hadir=D.att.filter(function(a){return a.tgl===tg&&ids[a.sid]&&a.st==='hadir'}).length,tercatat=D.att.filter(function(a){return a.tgl===tg&&ids[a.sid]}).length;
  var go2=pend?'<button class="btn sm" data-a="tab" data-t="telat">Tinjau '+pend+' laporan</button>':'';
  var on=D.staff.filter(function(x){return x.role==='Guru piket'&&isPiket(x)}).map(function(x){return esc(x.nama)}).join(', ')||'belum ada jadwal';
  var note={'Admin':'Ringkasan pengelolaan sistem dan seluruh siswa.','Kepala madrasah':'Gambaran kedisiplinan seluruh madrasah. Peranmu hanya melihat data.','Waka Siswa':'Pantau kedisiplinan seluruh kelas dan siswa yang perlu tindak lanjut.','Guru BK':'Fokus pada siswa yang perlu pembinaan dan pelanggaran berat.','Guru piket':'Tugas piket hari ini: kehadiran dan laporan keterlambatan.','Wali kelas':'Kondisi kelas perwalianmu: kehadiran, keterlambatan, pulang cepat, dan pelanggaran.'}[r]||'';
  var t4=r==='Guru piket'?[[hadir,'Hadir hari ini','var(--good)'],[Math.max(sc.length-tercatat,0),'Belum tercatat','var(--bad)'],[pend,'Laporan menunggu','var(--gold)'],[pc,'Pulang cepat hari ini','var(--blue)']]:[[sc.length,'Siswa','var(--blue)'],[tp,'Poin pelanggaran','var(--bad)'],[lt,'Terlambat hari ini','var(--gold)'],[pc,'Pulang cepat hari ini','var(--blue)']];
  var out='<p class="muted" style="margin:0 0 12px;font-size:14.5px">'+note+'</p>'+cardH('Ringkasan',tiles(t4),go2);
  var cl=function(x){return '<div style="height:14px"></div>'+x};
  if(r==='Admin'){out+=cl(cardH('Status sistem','<p style="margin:0 0 6px"><b>Akun staf:</b> '+D.staff.length+' &middot; <b>Batas jam masuk:</b> '+esc(D.cfg.jam)+'</p><p style="margin:0"><b>Piket hari ini:</b> '+on+'</p>'))+cl(cardH('Peringkat kedisiplinan seluruh siswa',rankT(sc),can(u,'reset')?'<button class="btn ghost sm" data-a="reset">Kembalikan data contoh</button>':''))}
  else if(r==='Kepala madrasah'){out+=cl(cardH('Rekap per kelas',perKelasT(sc)))+cl(cardH('Keterlambatan dan pulang cepat terbaru',eventsT(ids)))+cl(cardH('Siswa yang perlu perhatian',perhatianT(sc)))}
  else if(r==='Waka Siswa'){out+=cl(cardH('Rekap per kelas',perKelasT(sc)))+cl(cardH('Keterlambatan dan pulang cepat terbaru',eventsT(ids)))+cl(cardH('Siswa yang perlu tindak lanjut',perhatianT(sc)))}
  else if(r==='Guru BK'){var hv=D.records.filter(function(x){return x.type==='pelanggaran'&&x.poin>10&&ids[x.sid]}).sort(function(a,b){return b.tgl.localeCompare(a.tgl)}).slice(0,6);
    out+=cl(cardH('Siswa yang perlu pembinaan',perhatianT(sc)))+cl(cardH('Pelanggaran berat terbaru',tbl(['Tanggal','Siswa','Kategori','Poin'],hv.map(function(x){var s2=byId(x.sid);return '<tr><td style="white-space:nowrap">'+fmt(x.tgl)+'</td><td>'+esc(s2?s2.nama:'-')+'</td><td class="muted">'+esc(x.kat)+'</td><td><span class="pt bad">'+x.poin+'</span></td></tr>'}),'Belum ada pelanggaran berat.')))}
  else if(r==='Guru piket'){var belum=sc.filter(function(x){return !D.att.some(function(a){return a.sid===x.id&&a.tgl===tg})}).slice(0,10);
    out+=cl(cardH('Status piket',isPiket(u)?'<p style="margin:0"><span class="pt good">Kamu bertugas hari ini</span></p><p class="muted" style="margin:8px 0 0;font-size:14px">Kamu dapat mengisi kehadiran dan menyetujui laporan keterlambatan.</p>':'<p style="margin:0"><span class="pt wait">Bukan hari piketmu</span></p><p class="muted" style="margin:8px 0 0;font-size:14px">Piket hari ini: '+on+'. Kehadiran dan persetujuan hanya bisa dilakukan pada hari tugasmu.</p>'))+cl(cardH('Belum tercatat hadir hari ini',tbl(['Nama','Kelas'],belum.map(function(x){return '<tr><td>'+esc(x.nama)+'</td><td class="muted">'+esc(x.kelas)+'</td></tr>'}),'Semua siswa di kelas tugasmu sudah tercatat.')))}
  else if(r==='Wali kelas'){var c={hadir:0,sakit:0,izin:0,alpa:0};D.att.filter(function(a){return ids[a.sid]}).forEach(function(a){c[a.st]++});
    out+=cl(cardH('Rekap kehadiran kelas',tiles([[c.hadir,'Hadir','var(--good)'],[c.sakit,'Sakit','var(--gold)'],[c.izin,'Izin','var(--blue)'],[c.alpa,'Alpa','var(--bad)']])))+cl(cardH('Keterlambatan dan pulang cepat terbaru',eventsT(ids)))+cl(cardH('Siswa yang perlu perhatian',perhatianT(sc)))+cl(cardH('Peringkat kedisiplinan kelas',rankT(sc)))}
  else{out+=cl(cardH('Rekap per kelas yang kamu ajar',perKelasT(sc)))+cl(cardH('Siswa yang perlu perhatian',perhatianT(sc)))}
  return out}

var ALASAN_P=['Sakit atau kondisi kesehatan','Dijemput orang tua atau wali','Keperluan keluarga mendesak','Mengikuti kegiatan atau lomba di luar madrasah','Berobat atau kontrol ke dokter','Alasan lain (dicatat di keterangan)'];
function tPulang(){
  var ok=can(S.user,'pulang'),l=D.pulang.filter(function(x){return visible(x.sid)}).sort(function(a,b){return (b.tgl+b.waktu).localeCompare(a.tgl+a.waktu)}).slice(0,15),now=new Date();
  var tb=tbl(['Siswa','Waktu','Alasan','Dicatat oleh'],l.map(function(x){var s2=byId(x.sid);return '<tr><td>'+esc(s2?s2.nama:'Siswa dihapus')+'<div class="muted" style="font-size:13px">'+esc(s2?s2.kelas:'')+'</div></td><td style="white-space:nowrap">'+fmt(x.tgl)+'<div class="muted" style="font-size:13px">'+esc(x.waktu)+'</div></td><td>'+esc(x.alasan)+(x.cat?'<div class="muted" style="font-size:13px">'+esc(x.cat)+'</div>':'')+'</td><td class="muted">'+esc(x.oleh||'-')+'</td></tr>'}),'Belum ada catatan pulang cepat.');
  var f=ok?'<div class="card"><div class="h"><h3>Catat pulang cepat</h3></div><form class="stack" data-f="pulang"><label>Siswa<select name="sid">'+opts(D.students)+'</select></label><label>Alasan<select name="alasan">'+ALASAN_P.map(function(a){return '<option>'+esc(a)+'</option>'}).join('')+'</select></label><label>Jam keluar<input name="waktu" type="time" value="'+hm(now)+'"></label><label>Tanggal<input name="tgl" type="date" value="'+today()+'"></label><label>Keterangan (opsional)<textarea name="cat" placeholder="Contoh: dijemput ayah pukul 10.30"></textarea></label>'+(S.err?'<p class="err">'+esc(S.err)+'</p>':'')+(S.flash?'<p class="ok">'+esc(S.flash)+'</p>':'')+'<button class="btn" type="submit">Simpan</button></form></div>'
   :'<div class="card"><div class="h"><h3>Catat pulang cepat</h3></div><p class="empty">Pencatatan pulang cepat dilakukan guru piket pada hari tugasnya, atau oleh admin.</p></div>';
  return '<div class="two">'+f+'<div class="card"><div class="h"><h3>Riwayat pulang cepat</h3></div>'+tb+'</div></div>'}
function tRecord(type){
  if(!can(S.user,'catat'))return lockedCatat();
  if(type==='reward'&&!can(S.user,'reward'))return '<div class="card"><div class="h"><h3>Input penghargaan</h3></div><p class="empty">Penghargaan hanya dicatat oleh Waka Siswa atau admin.</p></div>';
  var isP=type==='pelanggaran',recent=D.records.filter(function(r){return r.type===type&&visible(r.sid)}).sort(function(a,b){return b.tgl.localeCompare(a.tgl)}).slice(0,6);
  return '<div class="two"><div class="card"><div class="h"><h3>'+(isP?'Catat pelanggaran':'Catat penghargaan')+'</h3></div><form class="stack" data-f="rec" data-type="'+type+'"><label>Siswa<select name="sid">'+opts(D.students)+'</select></label>'+
  '<label>Kategori<select name="kat" data-a="kat">'+katList(type).map(function(x){var k=x[0];return '<option value="'+x[1]+'">'+esc(k[0])+(k[1]?' ('+k[1]+' poin)':'')+'</option>'}).join('')+'</select></label>'+(limit(type)?'<p class="muted" style="margin:0;font-size:13.5px">Guru dapat mencatat pelanggaran ringan (maksimal 10 poin). Pelanggaran berat dicatat Guru BK atau admin.</p>':'')+
  '<label id="manual" hidden>Poin manual<input name="poin" type="number" min="1" placeholder="Contoh: 10"></label>'+
  '<label>Tanggal<input name="tgl" type="date" value="'+today()+'"></label><label>Catatan<textarea name="cat" placeholder="Tulis kejadian singkat"></textarea></label>'+
  (S.err?'<p class="err">'+esc(S.err)+'</p>':'')+(S.flash?'<p class="ok">'+esc(S.flash)+'</p>':'')+'<button class="btn '+(isP?'bad':'gold')+'" type="submit">Simpan catatan</button></form></div>'+
  '<div class="card"><div class="h"><h3>Catatan terbaru</h3></div>'+(recent.length?recent.map(function(r){var s=byId(r.sid);return '<div class="rec"><div class="l"><span>'+esc(s?s.nama:'Siswa dihapus')+'</span><span class="pt '+(isP?'bad':'good')+'">'+(isP?'-':'+')+r.poin+'</span></div><div class="muted">'+esc(r.kat)+' &middot; '+fmt(r.tgl)+'</div></div>'}).join(''):'<p class="empty">Belum ada catatan. Isi formulir di samping untuk memulai.</p>')+'</div></div>'}

  (S.err?'<p class="err">'+esc(S.err)+'</p>':'')+(S.flash?'<p class="ok">'+esc(S.flash)+'</p>':'')+'<button class="btn" type="submit">Simpan kehadiran</button></form></div>'+
  '<div class="card"><div class="h"><h3>Input terbaru</h3></div><div class="scroll"><table><thead><tr><th>Siswa</th><th>Tanggal</th><th>Status</th></tr></thead><tbody>'+
  (recent.length?recent.map(function(a){var s=byId(a.sid);return '<tr><td>'+esc(s?s.nama:'Siswa dihapus')+'</td><td style="white-space:nowrap">'+fmt(a.tgl)+'</td><td style="text-transform:capitalize">'+a.st+'</td></tr>'}).join(''):'<tr><td colspan="3" class="muted">Belum ada data kehadiran.</td></tr>')+'</tbody></table></div></div></div>'}

  if(!can(S.user,'siswa'))return lockedSiswa();
  return '<div class="two"><div class="card"><div class="h"><h3>Tambah siswa</h3></div><form class="stack" data-f="stu"><label>NIS<input name="nis" placeholder="24007"></label><label>Nama lengkap<input name="nama" placeholder="Nama siswa"></label><label>Kelas<input name="kelas" placeholder="XI IPA 1"></label>'+

  '<div class="card"><div class="h"><h3>Daftar siswa</h3></div><input class="search" id="q" data-a="q" placeholder="Cari nama, NIS, atau kelas"><div class="scroll" id="stlist">'+stList('')+'</div></div></div>'}
function stList(q){
  q=q.toLowerCase();var l=D.students.filter(function(s){return (s.nama+s.nis+s.kelas).toLowerCase().indexOf(q)>-1});
  return '<table><thead><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th></th></tr></thead><tbody>'+(l.length?l.map(function(s){return '<tr><td style="font-family:var(--mono)">'+esc(s.nis)+'</td><td>'+esc(s.nama)+'</td><td class="muted">'+esc(s.kelas)+'</td><td><button class="x" data-a="del" data-id="'+esc(s.id)+'">Hapus</button></td></tr>'}).join(''):'<tr><td colspan="4" class="muted">Tidak ada siswa yang cocok.</td></tr>')+'</tbody></table>'}

function vStaff(){
  var pend=D.late.filter(function(x){return x.status==='menunggu'&&visible(x.sid)}).length;
  var T=[["ringkasan","Ringkasan"],["telat","Keterlambatan"+(pend?' ('+pend+')':'')],["pulang","Pulang cepat"],["pelanggaran","Input pelanggaran"],["reward","Input penghargaan"],["absensi","Absensi"],["siswa","Kelola siswa"],["impor","Impor siswa"],["akun","Kelola akun"],["akses","Hak akses"]];
  var ro=S.user.role,okT={'Admin':null,'Kepala madrasah':['ringkasan','telat','pulang','akses'],'Waka Siswa':['ringkasan','telat','pulang','pelanggaran','reward','akses'],'Guru BK':['ringkasan','telat','pulang','pelanggaran','akses'],'Guru piket':['ringkasan','telat','pulang','pelanggaran','absensi','akses'],'Wali kelas':['ringkasan','telat','pulang','pelanggaran','akses']}[ro];
  if(okT){T=T.filter(function(t){return okT.indexOf(t[0])>-1});if(okT.indexOf(S.tab)<0)S.tab='ringkasan'}
  var body={ringkasan:tRingkasan,pelanggaran:function(){return tRecord('pelanggaran')},pulang:tPulang,reward:function(){return tRecord('reward')},absensi:tAbsen,siswa:tSiswa,telat:tTelat,impor:tImpor,akun:tAkun,akses:tAkses}[S.tab]();
  return top('Portal '+esc(S.user.role.toLowerCase()),esc(S.user.nama)+dutyNote(S.user))+'<div class="layout"><div class="tabs" role="tablist">'+T.map(function(t){return '<button class="tab" role="tab" aria-selected="'+(S.tab===t[0])+'" data-a="tab" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div><div style="min-width:0">'+body+'</div></div>'}

function render(){
  var h=S.view==='portal'?vPortal():S.view==='ls'?vLogin('ls'):S.view==='lg'?vLogin('lg'):S.view==='siswa'?vSiswa():S.view==='hp'?vHp():vStaff();
  $app.innerHTML=h;
}
function go(v){if(v==='portal')v=HOME;if(v==='hp')S.hp={step:'login'};S.view=v;S.err='';S.flash='';render();window.scrollTo(0,0)}

$app.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a;
  if(a==='go')go(t.dataset.v);
  else if(a==='fill'){document.getElementById('lu').value=t.dataset.u;document.getElementById('lp').value=t.dataset.p}
  else if(a==='out'){S.user=null;S.kind=null;go('portal')}
  else if(a==='tab'){S.tab=t.dataset.t;S.err='';S.flash='';render()}
  else if(a==='reset'&&can(S.user,'reset')){D=seed();S.user=D.staff.find(function(x){return x.id===S.user.id})||S.user;save();S.flash='';render()}
  else if(a==='hpscan'&&S.hp&&S.hp.user){S.hp.step='scan';S.hp.err='';render()}
  else if(a==='hptouch'&&S.hp&&S.hp.step==='scan'){S.hp.step='scanning';render();setTimeout(function(){if(S.view==='hp'&&S.hp&&S.hp.step==='scanning')hpProcess()},1500)}
  else if(a==='hpback'&&S.hp&&S.hp.user){S.hp.step='home';S.hp.err='';render()}
  else if(a==='hpout'){S.hp={step:'login'};render()}
  else if((a==='lsetuju'||a==='ltolak')&&can(S.user,'setuju')){var lr=D.late.find(function(x){return x.id===t.dataset.id});
    if(lr&&lr.status==='menunggu'&&visible(lr.sid)){var nw=new Date();lr.status=a==='lsetuju'?'disetujui':'ditolak';lr.oleh=S.user.nama;lr.putus=dstr(nw)+' '+hm(nw);
      if(a==='ltolak')D.records.push({id:uid(),sid:lr.sid,type:'pelanggaran',kat:'Terlambat masuk sekolah',poin:5,lid:lr.id,cat:'Alasan terlambat ditolak guru piket ('+lr.alasan+', '+fmtMenit(lr.menit)+').',tgl:lr.tgl});
      if(!D.att.some(function(x){return x.sid===lr.sid&&x.tgl===lr.tgl}))D.att.push({id:uid(),sid:lr.sid,tgl:lr.tgl,st:'hadir'});
      save();render()}}
  else if(a==='lubah'&&can(S.user,'jadwal')){var lu=D.late.find(function(x){return x.id===t.dataset.id});
    if(lu&&(lu.status==='disetujui'||lu.status==='ditolak')){var nw3=new Date();
      if(lu.status==='disetujui'){lu.status='ditolak';D.records.push({id:uid(),sid:lu.sid,type:'pelanggaran',kat:'Terlambat masuk sekolah',poin:5,lid:lu.id,cat:'Alasan terlambat ditolak setelah ditinjau '+S.user.nama+' ('+lu.alasan+', '+fmtMenit(lu.menit)+').',tgl:lu.tgl})}
      else{lu.status='disetujui';D.records=D.records.filter(function(r){return !(r.lid===lu.id||(!r.lid&&r.sid===lu.sid&&r.tgl===lu.tgl&&r.kat==='Terlambat masuk sekolah'&&r.poin===5&&String(r.cat||'').indexOf('Alasan terlambat ditolak')===0))})}
      lu.ubah=S.user.nama+', '+dstr(nw3)+' '+hm(nw3);save();render()}}
  else if(a==='jamsave'&&can(S.user,'jadwal')){var jv=document.getElementById('jamin'),jt=jv?jv.value:'';if(!/^\d{2}:\d{2}$/.test(jt)){S.flash='';S.err='Isi jam dengan format jam:menit.';render();return}D.cfg.jam=jt;save();S.err='';S.flash='Batas jam masuk disimpan.';render()}
  else if(a==='impparse'&&can(S.user,'siswa')){var tx=document.getElementById('imptxt'),val=tx?tx.value:'';if(!val.trim()){S.err='Tempel data atau pilih file terlebih dahulu.';S.flash='';render();return}S.err='';S.flash='';S.imp=buildImport(parseDelim(val),'data tempel');render()}
  else if(a==='impgo'&&can(S.user,'siswa')&&S.imp){var add=S.imp.items.filter(function(x){return x.st==='ok'});add.forEach(function(x){D.students.push({id:uid(),nis:x.nis,nama:x.nama,kelas:x.kelas,pass:x.nis})});save();S.imp=null;S.err='';S.flash=add.length+' siswa berhasil diimpor. Sandi awal sama dengan NIS.';render()}
  else if(a==='impclear'){S.imp=null;S.err='';S.flash='';render()}
  else if(a==='impcopy'){var smp='NIS;Nama;Kelas\n24007;Contoh Siswa Satu;XI IPA 1\n24008;Contoh Siswa Dua;XI IPS 2';try{navigator.clipboard.writeText(smp).then(function(){S.err='';S.flash='Contoh format disalin.';render()},function(){S.flash='';S.err='Salin otomatis tidak didukung. Pilih teks contoh lalu salin manual.';render()})}catch(er){S.flash='';S.err='Salin otomatis tidak didukung. Pilih teks contoh lalu salin manual.';render()}}
  else if(a==='delacc'&&can(S.user,'akun')){var aid=t.dataset.id;if(aid!==S.user.id){D.staff=D.staff.filter(function(x){return x.id!==aid});save();render()}}
  else if(a==='del'&&can(S.user,'siswa')){var id=t.dataset.id;D.students=D.students.filter(function(s){return s.id!==id});D.records=D.records.filter(function(r){return r.sid!==id});D.att=D.att.filter(function(r){return r.sid!==id});save();render()}
});
$app.addEventListener('change',function(e){
  if(e.target.id==='impfile'){readImpFile(e.target.files&&e.target.files[0]);return}
  if(e.target.dataset.a==='kat'){var f=e.target.form,type=f.dataset.type,m=KAT[type][+e.target.value][1]===0;document.getElementById('manual').hidden=!m}
  if(e.target.dataset.a==='kl'&&can(S.user,'jadwal')){var sf=D.staff.find(function(x){return x.id===e.target.dataset.id}),kk=e.target.dataset.k;if(sf){sf.kelas=sf.kelas||[];var jx=sf.kelas.indexOf(kk);if(e.target.checked&&jx<0)sf.kelas.push(kk);if(!e.target.checked&&jx>-1)sf.kelas.splice(jx,1);save();render()}}
  if(e.target.dataset.a==='pk'&&can(S.user,'jadwal')){var st=D.staff.find(function(x){return x.id===e.target.dataset.id}),d=+e.target.dataset.d;if(st){st.piket=st.piket||[];var ix=st.piket.indexOf(d);if(e.target.checked&&ix<0)st.piket.push(d);if(!e.target.checked&&ix>-1)st.piket.splice(ix,1);save();render()}}
});
$app.addEventListener('input',function(e){
  if(e.target.dataset.a==='q'){document.getElementById('stlist').innerHTML=stList(e.target.value)}
});
$app.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,k=f.dataset.f,v=function(n){return (f.elements[n]?f.elements[n].value:'').trim()};
  S.err='';S.flash='';
  if(k==='ls'){
    var s=D.students.find(function(x){return x.nis===v('u')});
    if(!s||s.pass!==v('p')){S.err='NIS atau kata sandi tidak cocok. Periksa lagi atau ketuk akun contoh di bawah.';render();return}
    S.user=s;S.kind='siswa';S.loginAt=new Date();go('siswa');return}
  if(k==='lg'){
    var u=D.staff.find(function(x){return x.user===v('u').toLowerCase()});
    if(!u||u.pass!==v('p')){S.err='Username atau kata sandi tidak cocok. Periksa lagi atau ketuk akun contoh di bawah.';render();return}
    S.user=u;S.kind='staff';S.tab='ringkasan';go('staff');return}
  if(k==='rec'){
    if(!can(S.user,'catat')){S.err='Peranmu hanya bisa melihat data.';render();return}
    var type=f.dataset.type,kat=KAT[type][+v('kat')],poin=kat[1]||+v('poin');
    if(type==='reward'&&!can(S.user,'reward')){S.err='Penghargaan hanya dicatat Waka Siswa atau admin.';render();return}
    if(!v('sid')){S.err='Pilih siswa terlebih dahulu.'}
    else if(!visible(v('sid'))){S.err='Siswa itu di luar lingkup kelasmu.'}
    else if(limit(type)&&(!kat[1]||kat[1]>10)){S.err='Pelanggaran ini hanya bisa dicatat Guru BK atau admin.'}
    else if(!poin||poin<1){S.err='Isi jumlah poin lebih dari 0.'}
    else{D.records.push({id:uid(),sid:v('sid'),type:type,kat:kat[1]?kat[0]:(v('cat').split('.')[0]||'Lainnya'),poin:poin,cat:v('cat'),tgl:v('tgl')||today()});save();S.flash=type==='reward'?'Penghargaan tercatat.':'Pelanggaran tercatat.'}
    render();return}
  if(k==='pulang'){
    if(!can(S.user,'pulang')){S.err='Pencatatan pulang cepat hanya oleh guru piket yang bertugas atau admin.';render();return}
    if(!v('sid')||!visible(v('sid'))){S.err='Pilih siswa yang ada di lingkupmu.'}
    else if(ALASAN_P.indexOf(v('alasan'))<0){S.err='Pilih salah satu alasan.'}
    else if(!/^\d{2}:\d{2}$/.test(v('waktu'))){S.err='Isi jam keluar.'}
    else{var tp2=v('tgl')||today();D.pulang.push({id:uid(),sid:v('sid'),tgl:tp2,waktu:v('waktu'),alasan:v('alasan'),cat:v('cat'),oleh:S.user.nama});if(!D.att.some(function(x){return x.sid===v('sid')&&x.tgl===tp2}))D.att.push({id:uid(),sid:v('sid'),tgl:tp2,st:'hadir'});save();S.flash='Pulang cepat tercatat.'}
    render();return}
  if(k==='att'){
    if(!can(S.user,'absen')){S.err='Kamu tidak punya akses mengisi kehadiran saat ini.';render();return}
    if(!v('sid')){S.err='Pilih siswa terlebih dahulu.'}
    else if(!visible(v('sid'))){S.err='Siswa itu di luar lingkup kelasmu.'}
    else{D.att.push({id:uid(),sid:v('sid'),st:v('st'),tgl:v('tgl')||today()});save();S.flash='Kehadiran tersimpan.'}
    render();return}
  if(k==='hplogin'){
    var hs=D.students.find(function(x){return x.nis===v('u')});
    if(!hs||hs.pass!==v('p')){S.hp={step:'login',err:'NIS atau kata sandi tidak cocok. Ketuk akun contoh untuk mengisi otomatis.'}}
    else{S.hp={step:'home',user:hs}}
    render();return}
  if(k==='hplate'){
    var hh=S.hp,al3=v('alasan');
    if(!hh||!hh.user||hh.step!=='late')return;
    if(ALASAN.indexOf(al3)<0){hh.err='Pilih salah satu alasan.';render();return}
    var at3=hh.at||new Date(),tg4=dstr(at3);
    if(!D.late.some(function(x){return x.sid===hh.user.id&&x.tgl===tg4}))D.late.push({id:uid(),sid:hh.user.id,tgl:tg4,waktu:hm(at3),menit:hh.m,alasan:al3,status:'menunggu'});
    save();hh.err='';hh.step='done';hh.res={t:'late'};render();return}
  if(k==='late'){
    if(S.kind!=='siswa')return;
    var nw2=S.loginAt||new Date(),tg2=dstr(nw2),al=v('alasan'),mn=nw2.getHours()*60+nw2.getMinutes()-toMin(D.cfg.jam);
    if(ALASAN.indexOf(al)<0){S.err='Pilih salah satu alasan.'}
    else if(D.late.some(function(x){return x.sid===S.user.id&&x.tgl===tg2})){S.err='Laporan hari ini sudah dikirim.'}
    else if(nw2.getDay()===0||mn<=0){S.err='Kamu tidak terlambat hari ini.'}
    else{D.late.push({id:uid(),sid:S.user.id,tgl:tg2,waktu:hm(nw2),menit:mn,alasan:al,status:'menunggu'});save();S.flash='Laporan terkirim ke guru piket yang bertugas.'}
    render();return}
  if(k==='acc'){
    if(!can(S.user,'akun')){S.err='Hanya admin utama yang bisa membuat akun.';render();return}
    var un=v('user').toLowerCase();
    if(!v('nama')||!un||v('pass').length<6){S.err='Isi nama, username, dan kata sandi awal (minimal 6 karakter).'}
    else if(D.staff.some(function(x){return x.user===un})){S.err='Username itu sudah dipakai.'}
    else{var ac={id:uid(),user:un,nama:v('nama'),role:v('role'),pass:v('pass')};if(!allScope(ac))ac.kelas=[];if(ac.role==='Guru piket')ac.piket=[];D.staff.push(ac);save();S.flash=allScope(ac)?'Akun dibuat.':'Akun dibuat. Atur lingkup kelas'+(ac.role==='Guru piket'?' dan jadwal piket':'')+' di tab Hak akses.'}
    render();return}
  if(k==='stu'){
    if(!can(S.user,'siswa')){S.err='Hanya admin yang bisa menambah siswa.';render();return}
    if(!v('nis')||!v('nama')||!v('kelas')){S.err='Lengkapi NIS, nama, dan kelas.'}
    else if(D.students.some(function(s){return s.nis===v('nis')})){S.err='NIS itu sudah terdaftar.'}
    else{D.students.push({id:uid(),nis:v('nis'),nama:v('nama'),kelas:v('kelas'),pass:v('nis')});save();S.flash='Siswa ditambahkan. Kata sandi awal sama dengan NIS.'}
    render();return}
});
render();
})();
</script>
</html>
